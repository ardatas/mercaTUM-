<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Marketplace responsive check</title><style>body{margin:0;background:#333;color:white;font:14px system-ui}nav{height:48px;display:flex;gap:16px;align-items:center;padding:0 20px}iframe{display:block;border:0;margin:0 auto;background:#101112;height:calc(100vh - 48px);transform-origin:top center}button{padding:5px 12px}</style></head><body><nav>Offline responsive check <button onclick="resize(320)">320px</button><button onclick="resize(390)">390px</button><button onclick="resize(1440)">1440px</button><output id="report"></output></nav><iframe id="frame" title="Marketplace preview" src="/test/fixtures/chat-preview.html" style="width:390px"></iframe><script>
const frame=document.getElementById('frame');
function resize(w){frame.style.width=w+'px';frame.style.marginLeft=w>innerWidth?((innerWidth-w)/2)+'px':'auto';frame.style.transform=w>innerWidth?'scale(.8)':'none';}
setInterval(()=>{const d=frame.contentDocument;if(!d)return;const grid=d.querySelector('.mp-offer-grid');document.getElementById('report').textContent=`Viewport ${d.documentElement.clientWidth} / content ${d.documentElement.scrollWidth}`+(grid?` / ${frame.contentWindow.getComputedStyle(grid).gridTemplateColumns.split(' ').length} columns`:'');},500);
</script></body></html>
